<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel Reservation - Login & Signup</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #afb5b3;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-image: url('https://images.unsplash.com/photo-1566073771259-6a8506099945?q=80&w=2070&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
        }

        .auth-container {
            background-color: rgba(255, 255, 255, 0.95);
            padding: 2.5rem;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 450px;
            backdrop-filter: blur(5px);
        }

        .auth-container h2 {
            color: #3c2c50;
            margin-bottom: 1.5rem;
            font-weight: 700;
            text-align: center;
        }

        .form-control {
            background-color: #f8f9fa;
            border: 1px solid #dee2e6;
            border-radius: 8px;
            padding: 0.75rem 1rem;
            transition: all 0.3s ease;
        }

        .form-control:focus {
            background-color: #fff;
            border-color: #9a8af8;
            box-shadow: 0 0 0 0.25rem rgba(13, 110, 253, 0.25);
        }

        .btn-primary {
            background-color: #9e49db;
            border-color: #6a1ba3;
            font-weight: 500;
            padding: 0.75rem;
            border-radius: 8px;
            transition: background-color 0.3s ease;
        }

        .btn-primary:hover {
            background-color: #431167;
            border-color: #3e105f;
        }

        .auth-link {
            display: block;
            text-align: center;
            margin-top: 1rem;
            color: #8ca8b2;
            text-decoration: none;
            font-weight: 500;
        }

        .auth-link:hover {
            text-decoration: underline;
            color: #4c0082;
        }

        .optional-link {
            font-size: 0.9rem;
            color: #6c757d;
        }

        #signup-form {
            display: none;
        }
        
        .alert {
            font-size: 0.9rem;
            padding: 0.75rem 1rem;
        }
    </style>
</head>
<body>

    <div class="auth-container">
        <!-- Login Form -->
        <div id="login-form">
            <h2>Welcome Back</h2>
            <div id="login-alert" class="alert alert-danger d-none" role="alert"></div>
            <form onsubmit="return validateLogin()">
                <div class="mb-3">
                    <label for="login-email" class="form-label">Email or Username</label>
                    <input type="text" class="form-control" id="login-email" required>
                </div>
                <div class="mb-3">
                    <label for="login-password" class="form-label">Password</label>
                    <input type="password" class="form-control" id="login-password" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Login</button>
                <a href="#" class="auth-link optional-link">Forgot password?</a>
                <a href="#" class="auth-link" onclick="toggleForms()">Don’t have an account? <strong>Sign up</strong></a>
            </form>
        </div>

        <!-- Signup Form -->
        <div id="signup-form">
            <h2>Create Your Account</h2>
            <div id="signup-alert" class="alert alert-danger d-none" role="alert"></div>
            <form onsubmit="return validateSignup()">
                <div class="mb-3">
                    <label for="signup-name" class="form-label">Full Name</label>
                    <input type="text" class="form-control" id="signup-name" required>
                </div>
                <div class="mb-3">
                    <label for="signup-email" class="form-label">Email</label>
                    <input type="email" class="form-control" id="signup-email" required>
                </div>
                <div class="mb-3">
                    <label for="signup-phone" class="form-label">Phone Number</label>
                    <input type="tel" class="form-control" id="signup-phone" required>
                </div>
                <div class="mb-3">
                    <label for="signup-password" class="form-label">Password</label>
                    <input type="password" class="form-control" id="signup-password" required>
                </div>
                <div class="mb-3">
                    <label for="signup-confirm-password" class="form-label">Confirm Password</label>
                    <input type="password" class="form-control" id="signup-confirm-password" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Create Account</button>
                <a href="#" class="auth-link" onclick="toggleForms()">Already have an account? <strong>Login</strong></a>
            </form>
        </div>
    </div>

    <!-- JavaScript -->
    <script>
        const loginForm = document.getElementById('login-form');
        const signupForm = document.getElementById('signup-form');
        const loginAlert = document.getElementById('login-alert');
        const signupAlert = document.getElementById('signup-alert');

        function toggleForms() {
            // Reset alerts
            loginAlert.classList.add('d-none');
            signupAlert.classList.add('d-none');

            // Toggle visibility
            if (loginForm.style.display === 'none') {
                loginForm.style.display = 'block';
                signupForm.style.display = 'none';
            } else {
                loginForm.style.display = 'none';
                signupForm.style.display = 'block';
            }
        }

        function showAlert(alertElement, message) {
            alertElement.textContent = message;
            alertElement.classList.remove('d-none');
        }

        function validateLogin() {
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;

            if (!email || !password) {
                showAlert(loginAlert, 'Both fields are required.');
                return false; // Prevent form submission
            }
            
            // On successful validation (for demo purposes)
            showAlert(loginAlert, 'Login successful! Redirecting...');
            loginAlert.classList.replace('alert-danger', 'alert-success');
            // In a real application, you would proceed with server-side authentication here.
            return false; // Prevent form submission for this demo
        }

        function validateSignup() {
            const name = document.getElementById('signup-name').value;
            const email = document.getElementById('signup-email').value;
            const phone = document.getElementById('signup-phone').value;
            const password = document.getElementById('signup-password').value;
            const confirmPassword = document.getElementById('signup-confirm-password').value;
            
            // Simple validation checks
            if (!name || !email || !phone || !password || !confirmPassword) {
                showAlert(signupAlert, 'All fields are required.');
                return false;
            }

            if (password !== confirmPassword) {
                showAlert(signupAlert, 'Passwords do not match.');
                return false;
            }

            if (password.length < 8) {
                showAlert(signupAlert, 'Password must be at least 8 characters long.');
                return false;
            }

            // On successful validation (for demo purposes)
            showAlert(signupAlert, 'Account created successfully! Please login.');
            signupAlert.classList.replace('alert-danger', 'alert-success');
             // In a real application, you would proceed with server-side account creation.
            return false; // Prevent form submission for this demo
        }
    </script>

</body>
</html>
