<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel Reservation - Login & Signup</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #afb5b3;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-image: url('./imgs/sign1.jpg');
            background-size: cover;
            background-position: center;
        }

        .auth-container {
            background-color: rgba(255, 255, 255, 0.95);
            padding: 2.5rem;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 450px;
            backdrop-filter: blur(5px);
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            75% { transform: translateX(8px); }
        }
        .shake { animation: shake 0.4s ease-in-out; }

        .auth-container h2 {
            color: #eaa44f;
            margin-bottom: 1.5rem;
            font-weight: 700;
            text-align: center;
        }

        .form-control {
            background-color: #f8f9fa;
            border: 1px solid #dee2e6;
            border-radius: 8px;
            padding: 0.75rem 1rem;
        }

        .btn-primary {
            background-color: #ff774dcc;
            border: none;
            font-weight: 500;
            padding: 0.75rem;
            border-radius: 8px;
        }

        .btn-primary:hover { background-color: #e85c31cc; }

        .auth-link {
            display: block;
            text-align: center;
            margin-top: 1rem;
            color: #8ca8b2;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s;
        }

        .auth-link:active, .auth-link strong:active {
            color: #007bff !important;
        }

        .optional-link {
            font-size: 0.9rem;
            color: #6c757d;
        }

        #signup-form { display: none; }
        
        .alert {
            font-size: 0.85rem;
            border-radius: 8px;
            margin-bottom: 1.5rem;
            border: none;
        }
    </style>
</head>
<body>

    <div class="auth-container" id="main-container">
        <div id="login-form">
            <h2>Welcome Back</h2>
            <div id="login-alert" class="alert d-none" role="alert"></div>
            
            <form onsubmit="return validateLogin()" novalidate>
                <div class="mb-3">
                    <label for="login-email" class="form-label">Email or Username</label>
                    <input type="text" class="form-control" id="login-email">
                </div>
                <div class="mb-3">
                    <label for="login-password" class="form-label">Password</label>
                    <input type="password" class="form-control" id="login-password">
                </div>
                <button type="submit" class="btn btn-primary w-100">Login</button>
                <a href="#" class="auth-link optional-link">Forgot password?</a>
                <a href="#" class="auth-link" onclick="toggleForms()">Don't have an account? <strong>Sign up</strong></a>
            </form>
        </div>

        <div id="signup-form">
            <h2>Create Account</h2>
            <div id="signup-alert" class="alert d-none" role="alert"></div>
            
            <form onsubmit="return validateSignup()" novalidate>
                <div class="mb-3">
                    <label class="form-label">User Name</label>
                    <input type="text" class="form-control" id="signup-name">
                </div>
                <div class="mb-3">
                    <label class="form-label">Email Address</label>
                    <input type="email" class="form-control" id="signup-email">
                </div>
                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <input type="password" class="form-control" id="signup-password">
                </div>
                <div class="mb-3">
                    <label class="form-label">Confirm Password</label>
                    <input type="password" class="form-control" id="signup-confirm-password">
                </div>
                <button type="submit" class="btn btn-primary w-100">Create Account</button>
                <a href="#" class="auth-link" onclick="toggleForms()">Already have an account? <strong>Login</strong></a>
            </form>
        </div>
    </div>

    <script>
        const loginAlert = document.getElementById('login-alert');
        const signupAlert = document.getElementById('signup-alert');
        const container = document.getElementById('main-container');

        function toggleForms() {
            const loginForm = document.getElementById('login-form');
            const signupForm = document.getElementById('signup-form');
            loginAlert.classList.add('d-none');
            signupAlert.classList.add('d-none');

            if (loginForm.style.display === 'none') {
                loginForm.style.display = 'block';
                signupForm.style.display = 'none';
            } else {
                loginForm.style.display = 'none';
                signupForm.style.display = 'block';
            }
        }

        function isValidEmail(email) {
            const re = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            return re.test(email);
        }

        function showAlert(element, message, type = 'danger') {
            element.textContent = message;
            element.className = `alert alert-${type}`;
            if(type === 'danger') {
                container.classList.add('shake');
                setTimeout(() => container.classList.remove('shake'), 400);
            }
        }

        function validateLogin() {
            const userRef = document.getElementById('login-email').value.trim();
            const pass = document.getElementById('login-password').value.trim();

            if (!userRef || !pass) {
                showAlert(loginAlert, 'Please fill in both fields.');
                return false;
            }
            
            showAlert(loginAlert, 'Success! Logging in...', 'success');
            return true; 
        }

        function validateSignup() {
            const name = document.getElementById('signup-name').value.trim();
            const email = document.getElementById('signup-email').value.trim();
            const pass = document.getElementById('signup-password').value;
            const confirm = document.getElementById('signup-confirm-password').value;

            if (!name || !email || !pass || !confirm) {
                showAlert(signupAlert, 'All fields are required.');
                return false;
            }
            if (!isValidEmail(email)) {
                showAlert(signupAlert, 'Please enter a valid email address.');
                return false;
            }
            if (pass.length < 8) {
                showAlert(signupAlert, 'Password must be at least 8 characters.');
                return false;
            }
            if (pass !== confirm) {
                showAlert(signupAlert, 'Passwords do not match.');
                return false;
            }

            showAlert(signupAlert, 'Success! Account created.', 'success');
            setTimeout(toggleForms, 2000);
            return true;
        }
    </script>
</body>
</html>
